name = "telegram-gdrive-bot"
main = "index.js"
compatibility_date = "2024-11-01"
keep_vars = true

[triggers]
crons = ["0 */6 * * *", "30 18 * * *"]

[vars]
GITHUB_OWNER = "lamchochu"
GITHUB_REPO = "waguri-paglu-mirror-bot"
GITHUB_WORKFLOW = "mirror.yml"
WORKER_URL = "https://telegram-gdrive-bot.davexh.workers.dev"
OWNER_ID = "8699286601"

[[kv_namespaces]]
binding = "SETTINGS_KV"
id = "4c0b70d5a95546148d8578b1d71273af"

[[durable_objects.bindings]]
name = "STATE_DO"
class_name = "StateDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["StateDO"]
